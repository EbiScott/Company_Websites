<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Company websites editor</title>
  <link rel="stylesheet" href="/editor.css" />
</head>
<body>
  <header class="bar">
    <div class="bar__brand">
      <span class="bar__mark" aria-hidden="true">CW</span>
      <div>
        <strong>Company websites</strong>
        <small>local only · edits the six static sites</small>
      </div>
    </div>

    <div class="bar__meta">
      <label>Title
        <input id="meta-title" type="text" placeholder="Page title" />
      </label>
      <label>Description
        <input id="meta-description" type="text" placeholder="Meta description" />
      </label>
    </div>

    <div class="bar__actions">
      <button id="reload" class="btn" type="button">Reload</button>
      <button id="edit" class="btn btn--toggle" type="button" aria-pressed="false">Edit mode</button>
      <button id="save" class="btn btn--save" type="button">Save</button>
      <button id="publish" class="btn btn--publish" type="button">Publish</button>
    </div>
  </header>

  <div class="shell">
    <aside class="sites" aria-label="Sites">
      <p class="sites__label">Sites</p>
      <nav id="site-list" class="sites__list"></nav>
      <div class="sites__hint">
        <p>Edit the page directly in the preview. Click an image slot to replace its picture.</p>
      </div>
    </aside>

    <main class="stage">
      <div class="stage__bar">
        <span id="current-site">Loading…</span>
        <span id="dirty" class="dirty" hidden>Unsaved changes</span>
      </div>
      <div class="stage__frame">
        <iframe id="preview" title="Site preview"></iframe>
      </div>
      <div class="stage__status">
        <span id="status" class="status" role="status">Starting…</span>
        <span class="stage__note">Edits are written to the site folder. Publish commits and pushes.</span>
      </div>
    </main>
  </div>

  <input id="file" type="file" accept="image/*" hidden />

  <script src="/editor.js" defer></script>
</body>
</html>
